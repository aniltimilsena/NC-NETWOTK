<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Dhaka fabric-inspired geometric weave pattern -->
  <!-- Horizontal warp threads -->
  <line x1="0" y1="10" x2="80" y2="10" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="0" y1="20" x2="80" y2="20" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="0" y1="30" x2="80" y2="30" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="0" y1="40" x2="80" y2="40" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="0" y1="50" x2="80" y2="50" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="0" y1="60" x2="80" y2="60" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="0" y1="70" x2="80" y2="70" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <!-- Vertical weft threads -->
  <line x1="10" y1="0" x2="10" y2="80" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="20" y1="0" x2="20" y2="80" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="30" y1="0" x2="30" y2="80" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="40" y1="0" x2="40" y2="80" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="50" y1="0" x2="50" y2="80" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="60" y1="0" x2="60" y2="80" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="70" y1="0" x2="70" y2="80" stroke="#194332" stroke-width="0.6" stroke-opacity="0.12"/>
  <!-- Diamond motif overlay — Dhaka weave accent nodes -->
  <rect x="8" y="8" width="4" height="4" fill="#D4A373" fill-opacity="0.14" transform="rotate(45 10 10)"/>
  <rect x="28" y="28" width="4" height="4" fill="#D4A373" fill-opacity="0.14" transform="rotate(45 30 30)"/>
  <rect x="48" y="48" width="4" height="4" fill="#D4A373" fill-opacity="0.14" transform="rotate(45 50 50)"/>
  <rect x="68" y="68" width="4" height="4" fill="#D4A373" fill-opacity="0.14" transform="rotate(45 70 70)"/>
  <rect x="8" y="48" width="4" height="4" fill="#D4A373" fill-opacity="0.14" transform="rotate(45 10 50)"/>
  <rect x="48" y="8" width="4" height="4" fill="#D4A373" fill-opacity="0.14" transform="rotate(45 50 10)"/>
  <rect x="28" y="68" width="4" height="4" fill="#D4A373" fill-opacity="0.14" transform="rotate(45 30 70)"/>
  <rect x="68" y="28" width="4" height="4" fill="#D4A373" fill-opacity="0.14" transform="rotate(45 70 30)"/>
</svg>

